name: Deploy site

# Builds the site on every push. Only pushes to main are published;
# other branches are just built (to check them) and the result kept for a week
# under the run's "Artifacts", where it can be downloaded and inspected.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby and the site's gems (cached between runs)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build the site with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Build the search index with Pagefind
        run: npx --yes pagefind@1 --site _site

      - name: Publish (main branch only)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site

      - name: Keep the built site for inspection (other branches)
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: _site
          retention-days: 7
