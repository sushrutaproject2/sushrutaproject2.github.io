# -----------------------------------------------------------------------------
# The Compendium of Suśruta in Time and Space — Suśruta Project 2 website
#
# A small, hand-made Jekyll site in the same design as sushrutaproject1.
# Layouts: _layouts/   Header/footer/figures: _includes/   Styles: assets/css/style.scss
# Menu: pages with "nav: true" (and optional "dropdown: true" + "children:"),
# ordered by "nav_order". The thin top strip comes from _data/navigation.yml.
# -----------------------------------------------------------------------------

title: The Compendium of Suśruta in Time and Space
subtitle: Mapping a Medical Tradition
project_label: Project 2
project_dates: 2025–2029 · current
author: Dominik Wujastyk
description: >-
  A project on the history of medicine at the University of Alberta, studying the
  evolution of the Compendium of Suśruta between the ninth and nineteenth centuries.
keywords: Suśruta, Suśrutasaṃhitā, Āyurveda, India, Sanskrit, History of medicine
lang: en
timezone: UTC   # dates as on GitHub's servers, wherever the site is built

url: https://sushrutaproject2.github.io
baseurl: ""

# Shown in the footer
site_doi: 10.5281/zenodo.20737614
funding_note: >-
  A project at the <a href="https://ualberta.ca/">University of Alberta</a>, funded by
  <a href="https://www.sshrc-crsh.gc.ca/">SSHRC</a> Insight Grant 435-2025-0604.

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

permalink: /blog/:year/:title/
blog_description: An exploration of textual change and medical history
display_tags: ["palaeography", "images", "links", "textual_analysis", "Caraka", "Suśruta", "diagnosis"]
related_posts_max: 5

# Tag and year pages: /blog/tag/<tag>/ and /blog/<year>/
jekyll-archives:
  enabled: [year, tags]
  layouts:
    year: archive
    tag: archive
  permalinks:
    year: /blog/:year/
    tag: /blog/tag/:name/

# -----------------------------------------------------------------------------
# Collections and content
# -----------------------------------------------------------------------------

collections:
  projects:
    output: true
  participants:
    output: true

include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - _posts-drafts
  - _posts/_posts.zip

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: projects }
    values: { layout: page }
  - scope: { path: "assets" }
    values: { sitemap: false }

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true

sass:
  style: compressed

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------

plugins:
  - jekyll/scholar
  - jekyll-archives
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# -----------------------------------------------------------------------------
# Bibliography (jekyll-scholar)
#   In posts:  {% cite key %}  or  {% cite key -l 45 %}  and  {% bibliography --cited %}
#   Change the citation style here (e.g. chicago-author-date, modern-language-association).
# -----------------------------------------------------------------------------

scholar:
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  sort_by: author
  order: ascending
  group_by: year
  group_order: descending
  query: "@*"

# Fields used only by this website, hidden from the "BibTeX" box
filtered_bibtex_keywords:
  [abbr, abstract, additional_info, altmetric, annotation, arxiv, award, award_name,
   bibtex_show, blog, code, google_scholar_id, html, inspirehep_id, pdf, poster,
   preview, selected, slides, supp, video, website]
